<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Tavola Reservation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-bar">
    <button class="theme-btn" onclick="toggleTheme()">🌙 / ☀️</button>
    <select id="lang-switch" class="lang-selector" onchange="changeLanguage(this.value)">
        <option value="uk">🇺🇦 Українська</option>
        <option value="pl">🇵🇱 Polski</option>
        <option value="en">🇬🇧 English</option>
    </select>
</div>

<div class="container" id="auth-section">
    <h2 data-i18n="login_title" style="text-align: center;">Вхід / Реєстрація</h2>
    <input type="text" id="reg-name" data-i18n-placeholder="reg_name_ph" placeholder="Ваше ім'я" maxlength="50">
    <input type="text" id="reg-phone" data-i18n-placeholder="reg_phone_ph" placeholder="Ваш телефон (+48...)" maxlength="20">
    <input type="email" id="email" data-i18n-placeholder="email_ph" placeholder="E-mail (Логін)" maxlength="120">
    <input type="password" id="password" data-i18n-placeholder="pass_ph" placeholder="Пароль" maxlength="128">
    <button onclick="login()" data-i18n="login_btn">Увійти</button>
    <button onclick="register()" class="btn-secondary" data-i18n="register_btn">Зареєструватися</button>
</div>

<div class="container" id="dashboard" style="display: none;">
    <div class="header">
        <h2 data-i18n="dashboard_title">Резервація</h2>
        <div>
            <button id="admin-btn" class="btn-warning" style="display: none;" onclick="showAdminPanel()" data-i18n="admin_btn">👑 Admin Panel</button>
            <button onclick="logout()" class="btn-danger" data-i18n="logout_btn">Вийти</button>
        </div>
    </div>

    <div id="client-view">
        <div class="search-panel">
            <h3 style="margin-top: 0; text-align: center;" data-i18n="visit_params">📅 Параметри:</h3>
            <input type="datetime-local" id="search-date" onchange="loadTables()">
            <input type="number" id="guest-count" min="1" max="10" value="2" onchange="loadTables()" data-i18n-placeholder="guests_ph" placeholder="Кількість гостей">
            <input type="text" id="contact-phone" data-i18n-placeholder="phone_ph" placeholder="Ваш телефон (+48...)" maxlength="20">
            <input type="text" id="reservation-notes" data-i18n-placeholder="notes_ph" placeholder="Побажання до столика" maxlength="300">
        </div>
        <h3 data-i18n="available_tables">Столики:</h3>
        <div id="tables-container"></div>
        <hr style="margin: 30px 0; border: 0; border-top: 1px solid var(--border-color);">
        <h2 data-i18n="my_reservations">Мої бронювання</h2>
        <div id="reservations-container"></div>
    </div>

    <div id="admin-view" style="display: none;">
        <button onclick="showClientPanel()" class="btn-secondary" style="margin-bottom: 20px;" data-i18n="back_btn">🔙 Повернутися</button>
        
        <h3 data-i18n="stats_title">📊 Статистика ресторану</h3>
        <div id="admin-stats" style="display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap;"></div>

        <div class="search-panel" style="display: flex; gap:10px; flex-wrap: wrap;">
            <h3 style="width: 100%;" data-i18n="add_table_title">➕ Додати новий столик</h3>
            <input type="number" id="new-table-num" data-i18n-placeholder="table_num_ph" placeholder="Номер столика" min="1" style="width: 48%;">
            <input type="number" id="new-table-capacity" data-i18n-placeholder="table_cap_ph" placeholder="Кількість місць" min="1" style="width: 48%;">
            <input type="text" id="new-table-loc" data-i18n-placeholder="table_loc_ph" placeholder="Локація (напр. Біля вікна)" maxlength="100">
            <button onclick="addTable()" data-i18n="add_table_btn">Додати столик</button>
        </div>
        
        <h3 data-i18n="manage_tables_title">🪑 Управління столиками</h3>
        <div id="admin-tables" style="margin-bottom: 30px;"></div>

        <h3 data-i18n="all_res_title">📅 Усі бронювання клієнтів</h3>
        <div id="admin-reservations"></div>
    </div>
</div>

<div id="toast-container"></div>
<div id="custom-confirm" class="modal-overlay" style="display: none;">
    <div class="modal-box">
        <p id="confirm-msg" style="font-size: 18px; font-weight: 600;"></p>
        <div class="modal-buttons">
            <button id="confirm-yes" class="btn-danger" data-i18n="btn_yes">Так</button>
            <button id="confirm-no" class="btn-secondary" data-i18n="btn_no">Ні</button>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
